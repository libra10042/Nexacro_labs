server:
  port: 8080

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  # 예제용 파일 기반 H2. 운영 DB(MySQL/PostgreSQL 등)로 바꾸려면
  # url/driver-class-name/username/password 와 pom.xml의 드라이버 의존성만 교체하면 됨
  datasource:
    url: jdbc:h2:file:./data/excelupload;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
